spring:
  application:
    name: test

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  messages:
    encoding: UTF-8

  threads:
    virtual:
      enabled: true

  cache:
    type: redis

  data:
    redis:
      host: localhost
      port: 6379

  ai:
    openai:
      api-key: ${OPENAI_SECRET}
      chat:
        options:
          model: gpt-4o-mini

server:
  servlet:
    context-path: /api/v1

jwt:
  secret: ${JWT_SECRET}

auth:
  access-token:
    expiry-minutes: 5
  refresh-token:
    expiry-hours: 1

logging:
  level:
    org.hibernate: WARN
    org.springframework.security: WARN

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: -method

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

sales-report:
  path: ${SALES_REPORT_PATH}